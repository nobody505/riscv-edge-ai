name: Security

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  source-and-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck shellcheck
          python -m pip install --disable-pip-version-check bandit pip-audit
      - name: Scan personal data and project identifiers
        run: python scripts/check-repository-safety.py
      - name: Compile first-party Python
        run: python -m compileall -q hardware network scripts voice tests
      - name: Run security invariant tests
        run: python -m unittest discover -s tests -v
      - name: Run Bandit
        run: bandit -q -r hardware network scripts voice -x voice/vendor -ll
      - name: Audit Python dependency lock
        run: pip-audit --no-deps -r requirements.lock.txt
      - name: Check shell scripts
        run: shellcheck scripts/*.sh scripts/elder-hwctl yolo-mipi/*.sh
      - name: Check C and C++ sources
        run: |
          cppcheck --error-exitcode=1 --std=c11 hardware/*.c yolo-mipi/hook_simple.c
          cppcheck --error-exitcode=1 --std=c++17 yolo-mipi/src/consumer_final_new_gray.cpp
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if 'node_modules' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
                  print(path)
          PY
      - name: Validate archive paths and immutable artifacts
        run: |
          (cd vendor && sha256sum -c SHA256SUMS)
          (cd config && sha256sum -c SHA256SUMS)
          openssl x509 -in config/onenet-mqtt-ca.pem -checkend 2592000 -noout
          for archive in vendor/*.tar.gz; do python scripts/validate-tar-archive.py "$archive"; done
          (cd models/sensevoice && sha256sum -c SHA256SUMS.parts)
          cat models/sensevoice/parts/model_quant.onnx.part-* | sha256sum | grep -q '^e48d5da4a3cac65c09de6e926bea9ccc0e8c732a0d0dab84681bac5efba65d4e '
          (cd asrpro && sha256sum -c SHA256SUMS)
          (cd yolo-mipi && sha256sum -c SHA256SUMS)
      - name: Audit mobile dependencies
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --registry=https://registry.npmjs.org
